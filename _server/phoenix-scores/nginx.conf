# /etc/nginx/sites-available/scores.hallie.xyz  (certbot --nginx adds the TLS server)
limit_req_zone $binary_remote_addr zone=phxscores:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name scores.hallie.xyz;

    location /api/ {
        limit_req zone=phxscores burst=10 nodelay;
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
