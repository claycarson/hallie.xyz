<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hallie.xyz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/style.css">
<style>
  body {
    justify-content: center;
    padding-bottom: 40px;
    background: radial-gradient(ellipse at center, #0f0a2e 0%, #050818 70%);
  }

  #stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; background: #fff; border-radius: 50%; }

  .landing-title {
    font-size: clamp(2.4rem, 10vw, 4rem);
    text-align: center;
    margin-bottom: 6px;
    padding-top: 40px;
    position: relative;
    z-index: 1;
  }

  .landing-sub {
    font-size: clamp(0.9rem, 3vw, 1.1rem);
    color: rgba(255,255,255,0.6);
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 560px;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  .nav-card {
    background: rgba(255,255,255,0.07);
    border: 3px solid var(--card-color, rgba(255,255,255,0.25));
    border-radius: 20px;
    padding: 36px 20px 28px;
    text-decoration: none;
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform .15s, background .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .nav-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  .nav-card:active { transform: translateY(-1px); }

  .nav-card-icon  { font-size: 3.6rem; line-height: 1; }
  .nav-card-name  { font-size: 1.5rem; font-weight: bold; color: var(--card-color, #fff); }
  .nav-card-desc  { font-size: 0.9rem; color: rgba(255,255,255,0.5); line-height: 1.4; }
</style>
</head>
<body>

<div id="stars-bg"></div>

<div class="landing-title rainbow-text">hallie.xyz</div>
<div class="landing-sub">🌈 Games &amp; Projects 🦄</div>

<div class="nav-grid">
  <a href="games/" class="nav-card" style="--card-color: #4cff8c">
    <div class="nav-card-icon">🎮</div>
    <div class="nav-card-name">Games</div>
    <div class="nav-card-desc">Fun games to play</div>
  </a>
  <a href="projects/" class="nav-card" style="--card-color: #64c8ff">
    <div class="nav-card-icon">📁</div>
    <div class="nav-card-name">Projects</div>
    <div class="nav-card-desc">Tools and other things</div>
  </a>
</div>

<script>
const bg = document.getElementById('stars-bg');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = 1 + Math.random() * 2.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;`
    + `width:${sz}px;height:${sz}px;opacity:${0.3 + Math.random()*0.7}`;
  bg.appendChild(s);
}
</script>
</body>
</html>
