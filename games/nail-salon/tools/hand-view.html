<!doctype html>
<!-- Dev tool: look at assets/hand/hand.bin from any side, to find nail frames by eye.
     ?dir=x,y,z (camera sits that way from the target) &up=x,y,z &at=x,y,z &span=metres across the view
     &grid=1 draws 1 cm ticks on the three axes through `at`. Served by `npm run serve`. -->
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#fff}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadHand } from '../src/hand/model.js';
const Q = new URLSearchParams(location.search);
const vec = (k, d) => new THREE.Vector3(...(Q.get(k) || d).split(',').map(Number));
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2); renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0xffffff);
const scene = new THREE.Scene();
const geo = await loadHand(Q.get('file') || '../assets/hand/hand.bin');
scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd9b9a6, roughness: 0.6 })));
const at = vec('at', '0,0,0'), dir = vec('dir', '0,0,1').normalize(), span = Number(Q.get('span') || 0.25), a = innerWidth / innerHeight;
const cam = new THREE.OrthographicCamera(-span / 2, span / 2, span / 2 / a, -span / 2 / a, 0.001, 4);
cam.position.copy(at).addScaledVector(dir, 1); cam.up.copy(vec('up', '0,1,0')); cam.lookAt(at);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.copy(cam.position).add(new THREE.Vector3(0.4, 0.5, 0.3).applyQuaternion(cam.quaternion)); key.target.position.copy(at);
scene.add(key, key.target, new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.1));
if (Q.get('grid')) {
  const pts = [], cols = [], C = [[1, 0, 0], [0, 0.6, 0], [0, 0, 1]];
  for (let ax = 0; ax < 3; ax++) for (let k = -15; k <= 15; k++) {
    const p = at.clone(), t = new THREE.Vector3().setComponent((ax + 1) % 3, k % 5 ? 0.001 : 0.003);
    p.setComponent(ax, p.getComponent(ax) + k * 0.01);
    pts.push(...p.clone().sub(t).toArray(), ...p.clone().add(t).toArray()); cols.push(...C[ax], ...C[ax]);
  }
  for (let ax = 0; ax < 3; ax++) { const p = at.clone(), r = at.clone(); p.setComponent(ax, p.getComponent(ax) - 0.15); r.setComponent(ax, r.getComponent(ax) + 0.15); pts.push(...p.toArray(), ...r.toArray()); cols.push(...C[ax], ...C[ax]); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false })); l.renderOrder = 9; scene.add(l);
}
renderer.render(scene, cam);
window.__done = { box: geo.boundingBox };
</script>
