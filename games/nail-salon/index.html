<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nail Salon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f0d9cf; }
  html { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { background: var(--bg, #f0d9cf); font: 15px/1.3 system-ui, Helvetica, sans-serif; color: var(--ink, #4a3530); }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #debug { position: fixed; left: 8px; top: 8px; z-index: 10; padding: 8px 10px; border-radius: 10px;
           background: rgba(20, 16, 28, .78); color: #e9f3ff; font: 11px/1.35 ui-monospace, Menlo, monospace; max-width: 300px; }
  #debug pre { margin: 0 0 6px; white-space: pre-wrap; }
  #debug button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 0; }
  #debug nav { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #debug a { color: inherit; padding: 4px 7px; border-radius: 6px; background: rgba(255, 255, 255, .16); text-decoration: none; }
  /* The polish bottle: tap it to dip the brush. The colour inside drops as the brush runs low. */
  #bottle { position: fixed; right: max(18px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); z-index: 5;
            width: 92px; height: 150px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #bottle svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 6px 10px rgba(60, 30, 20, .25)); }
  #bottle .level { transition: transform .3s ease; transform-origin: 50% 100%; transform-box: fill-box; }
  #bottle.low svg { animation: bottle-pulse 1.1s ease-in-out infinite; }
  #bottle.dip svg { animation: bottle-dip .3s ease; }
  @keyframes bottle-pulse { 50% { transform: scale(1.08); } }
  @keyframes bottle-dip { 40% { transform: translateY(7px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { #bottle.low svg, #bottle.dip svg { animation: none; } }
  /* The turn button (R11): flips the hand fingertips-down / fingertips-up. */
  #turn { position: fixed; right: max(18px, env(safe-area-inset-right)); top: max(18px, env(safe-area-inset-top)); z-index: 5;
          width: 64px; height: 64px; padding: 0; border: 0; border-radius: 50%; background: var(--panel, #fff); color: var(--accent, #c9897a);
          box-shadow: 0 6px 14px rgba(60, 30, 20, .25); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #turn:active { transform: scale(.94); }
  #turn svg { width: 100%; height: 100%; display: block; transform: rotate(var(--spin, 0deg)); transition: transform .5s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { #turn svg { transition: none; } }
  /* Moving between nails: arrows beside the nail (nail view only) and the hand mini-map. */
  .arrow { position: fixed; top: 50%; z-index: 5; width: 64px; height: 64px; margin-top: -32px; padding: 0; border: 0; border-radius: 50%;
           background: var(--panel, #fff); color: var(--accent, #c9897a); box-shadow: 0 6px 14px rgba(60, 30, 20, .25); cursor: pointer;
           -webkit-tap-highlight-color: transparent; }
  .arrow:active { transform: scale(.94); }
  .arrow svg { width: 100%; height: 100%; display: block; }
  #prev { left: calc(50% - 300px); } #next { right: calc(50% - 300px); }
  body[data-view="hand"] .arrow { display: none; }
  #map { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: 96px; z-index: 5; width: 150px; height: 120px;
         -webkit-tap-highlight-color: transparent; }
  #map svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 4px 8px rgba(60, 30, 20, .2)); }
  #map .palm { fill: var(--map, #fff); opacity: .85; cursor: pointer; }
  #map .stalks path { stroke: var(--map, #fff); stroke-width: 16; stroke-linecap: round; fill: none; }
  #map .nail { cursor: pointer; }
  #map .nail .bare { fill: #f6e2dc; }
  #map .nail .edge { fill: none; stroke: rgba(0, 0, 0, .12); stroke-width: 1; }
  #map .nail.on { filter: drop-shadow(0 0 4px var(--accent, #c9897a)); }
  #map .nail.on .bare { fill: #fff; }
  #map .nail.on .edge { stroke: var(--accent, #c9897a); stroke-width: 2.5; }
  /* ?debug=frames */
  #frames { position: fixed; left: 8px; bottom: 8px; z-index: 10; padding: 8px 10px; width: 250px; border-radius: 10px;
            background: rgba(20, 16, 28, .78); color: #e9f3ff; font: 11px/1.35 ui-monospace, Menlo, monospace; }
  #frames label { display: block; margin-top: 4px; }
  #frames output { float: right; }
  #frames input { display: block; width: 100%; margin: 2px 0 0; }
  #frames button { font: inherit; margin-top: 8px; padding: 4px 8px; border-radius: 6px; border: 0; }
  /* The tray (PLAN §13.3): swab and remover pad above the bottle, Oops below. The chosen tool is lit. */
  .tool { position: fixed; right: max(32px, env(safe-area-inset-right)); z-index: 5; width: 64px; height: 64px; padding: 0; border: 0;
          border-radius: 50%; background: var(--panel, #fff); color: var(--accent, #c9897a); box-shadow: 0 6px 14px rgba(60, 30, 20, .25);
          cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tool svg { width: 100%; height: 100%; display: block; }
  .tool:active { transform: scale(.94); }
  .tool.on { box-shadow: 0 0 0 4px var(--accent, #c9897a), 0 6px 14px rgba(60, 30, 20, .25); }
  #swab { top: calc(50% - 75px - 160px); } #remover { top: calc(50% - 75px - 86px); }
  #oops { top: calc(50% + 75px + 22px); }
  #oops[disabled] { opacity: .35; cursor: default; }
  /* Clear coats, a second column beside the tray: base, gloss top coat, matte top coat. */
  .coat { right: calc(max(32px, env(safe-area-inset-right)) + 84px); }
  #base { top: calc(50% - 75px - 160px); } #gloss { top: calc(50% - 75px - 86px); } #matte { top: calc(50% - 75px - 12px); }
  #bottle.on svg { filter: drop-shadow(0 0 6px var(--accent, #c9897a)) drop-shadow(0 6px 10px rgba(60, 30, 20, .25)); }
  #boot-error { position: fixed; inset: auto 12px 12px 12px; padding: 10px; background: #fff; color: #a00; border-radius: 8px; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<button id="bottle" class="on" data-tool="polish" type="button" aria-label="Polish: tap to dip the brush">
  <svg viewBox="0 0 92 150" aria-hidden="true">
    <defs><clipPath id="bottle-glass"><rect x="12" y="62" width="68" height="80" rx="16"/></clipPath></defs>
    <rect x="34" y="4" width="24" height="50" rx="7" fill="#3b2f33"/>
    <rect x="30" y="50" width="32" height="14" rx="4" fill="#d9c7bd"/>
    <rect x="12" y="62" width="68" height="80" rx="16" fill="#fff" fill-opacity=".55"/>
    <g clip-path="url(#bottle-glass)"><rect class="level" x="12" y="62" width="68" height="80" fill="#c22"/></g>
    <rect x="12" y="62" width="68" height="80" rx="16" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
    <rect x="20" y="72" width="8" height="46" rx="4" fill="#fff" fill-opacity=".55"/>
  </svg>
</button>
<button id="swab" class="tool" data-tool="swab" type="button" aria-label="Swab: clean polish off the skin">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 44 44 20" stroke="#e7d6c9" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="17" cy="47" rx="9" ry="6" transform="rotate(-45 17 47)" fill="#fff" stroke="currentColor" stroke-width="2.5"/>
    <ellipse cx="47" cy="17" rx="9" ry="6" transform="rotate(-45 47 17)" fill="#fff" stroke="currentColor" stroke-width="2.5"/></svg>
</button>
<button id="remover" class="tool" data-tool="remover" type="button" aria-label="Remover pad: take the polish off">
  <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="17" fill="#fff" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4" opacity=".6"/>
    <path d="M27 30q5 -6 10 0" fill="none" stroke="#8fc8e8" stroke-width="3" stroke-linecap="round"/></svg>
</button>
<button id="base" class="tool coat" data-tool="base" type="button" aria-label="Base coat">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="27" y="10" width="10" height="14" rx="3" fill="#3b2f33"/>
    <rect x="25" y="23" width="14" height="5" rx="2" fill="#d9c7bd"/><rect x="19" y="27" width="26" height="27" rx="8" fill="#fff" stroke="currentColor" stroke-width="2.5"/><path d="M24 34v12" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/><text x="32" y="47" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Helvetica">B</text></svg>
</button>
<button id="gloss" class="tool coat" data-tool="gloss" type="button" aria-label="Shiny top coat">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="27" y="10" width="10" height="14" rx="3" fill="#3b2f33"/>
    <rect x="25" y="23" width="14" height="5" rx="2" fill="#d9c7bd"/><rect x="19" y="27" width="26" height="27" rx="8" fill="#fff" stroke="currentColor" stroke-width="2.5"/><path d="M32 33l2.2 4.8 4.8 2.2-4.8 2.2L32 47l-2.2-4.8-4.8-2.2 4.8-2.2z" fill="#f2c94c"/></svg>
</button>
<button id="matte" class="tool coat" data-tool="matte" type="button" aria-label="Matte top coat">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="27" y="10" width="10" height="14" rx="3" fill="#3b2f33"/>
    <rect x="25" y="23" width="14" height="5" rx="2" fill="#d9c7bd"/><rect x="19" y="27" width="26" height="27" rx="8" fill="#e6dcd6" stroke="currentColor" stroke-width="2.5"/><circle cx="27" cy="36" r="1.6" fill="#b9a9a0"/><circle cx="35" cy="41" r="1.6" fill="#b9a9a0"/><circle cx="30" cy="46" r="1.6" fill="#b9a9a0"/><circle cx="38" cy="34" r="1.6" fill="#b9a9a0"/></svg>
</button>
<button id="oops" class="tool" type="button" aria-label="Oops: undo" disabled>
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 28h16a10 10 0 0 1 0 20h-8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M27 18 17 28l10 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button id="turn" type="button" aria-label="Turn the hand">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <g id="turn-arrow"><path d="M14.3 28.9A18 18 0 0 1 45.8 20.4" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M51.9 27.8 51.1 15.9 40.8 24.3Z" fill="currentColor"/></g>
    <use href="#turn-arrow" transform="rotate(180 32 32)"/>
  </svg>
</button>
<button id="prev" class="arrow" type="button" aria-label="Nail to the left">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M37 19 24 32l13 13" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button id="next" class="arrow" type="button" aria-label="Nail to the right">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M27 19l13 13-13 13" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div id="map" role="group" aria-label="Nails"></div>
<div id="boot-error"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
