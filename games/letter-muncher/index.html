<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Letter Muncher — Hallie's Games</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
:root {
  --cell: min(calc((100vw - 24px) / 10), calc((100vh - 380px) / 10), 68px);
}

/* ── Grid ── */
#grid-wrapper {
  border: 3px solid rgba(255,255,255,0.18);
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  padding: 4px;
  margin: 4px auto;
  flex-shrink: 0;
}

#grid {
  display: grid;
  grid-template-columns: repeat(10, var(--cell));
  grid-template-rows: repeat(10, var(--cell));
  gap: 2px;
}

.cell {
  width: var(--cell);
  height: var(--cell);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  overflow: hidden;
}

.cell-letter {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.14);
  color: #dde;
  font-size: calc(var(--cell) * 0.42);
}

.cell-obstacle {
  background: rgba(0,0,0,0.25);
  font-size: calc(var(--cell) * 0.60);
}

.cell-player {
  background: rgba(76,255,140,0.22);
  border: 2px solid #4cff8c;
  z-index: 2;
}

.player-emoji {
  font-size: calc(var(--cell) * 0.52);
  line-height: 1;
}

.under-char {
  font-size: calc(var(--cell) * 0.24);
  color: #ffd700;
  line-height: 1;
  margin-top: -2px;
}

.cell-empty {
  background: rgba(255,255,255,0.035);
}

/* ── Word Bar ── */
#word-bar {
  width: 100%;
  max-width: calc(var(--cell) * 10 + 32px);
  padding: 8px 10px 4px;
  text-align: center;
  flex-shrink: 0;
}

#word-label {
  font-size: clamp(0.7rem, 2.5vw, 0.85rem);
  color: rgba(255,255,255,0.45);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

#hint-bar {
  margin-top: 6px;
  font-size: clamp(0.6rem, 2vw, 0.75rem);
  color: rgba(255,255,255,0.3);
}

#penalty-warning {
  display: none;
  margin-top: 5px;
  background: rgba(255,70,70,0.18);
  border: 1px solid rgba(255,70,70,0.5);
  border-radius: 8px;
  padding: 4px 12px;
  font-size: clamp(0.65rem, 2vw, 0.8rem);
  color: #ff9090;
}
#penalty-warning.show { display: block; }

@media (orientation: landscape) and (hover: none) {
  :root {
    --cell: min(calc((100vw - 216px) / 10), calc((100vh - 170px) / 10), 60px);
  }
  .dpad-area {
    position: fixed;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    padding: 8px;
    z-index: 5;
    background: rgba(13, 27, 42, 0.85);
    border-radius: 16px;
  }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="token-display" id="token-display">
    🪙 <span id="token-count">0</span> tokens
  </div>
  <div class="score-display">
    📖 Words: <span id="words-count">0</span>
  </div>
  <a href="../" class="back-btn">← Games</a>
</div>

<!-- GRID -->
<div id="grid-wrapper">
  <div id="grid"></div>
</div>

<!-- WORD BAR -->
<div id="word-bar">
  <div id="word-label">Spell this word:</div>
  <div class="word-letters" id="word-letters"></div>
  <div id="hint-bar">Arrow keys or D-pad to move &nbsp;•&nbsp; SPACE or EAT to grab a letter</div>
  <div id="penalty-warning">⚠️ Wrong letters cost a token now — be careful!</div>
</div>

<!-- D-PAD -->
<div class="dpad-area">
  <div class="dpad">
    <div class="db-empty"></div>
    <button class="db" id="db-up"    aria-label="Up">↑</button>
    <div class="db-empty"></div>

    <button class="db" id="db-left"  aria-label="Left">←</button>
    <button class="db db-eat" id="db-eat" aria-label="Eat letter">EAT</button>
    <button class="db" id="db-right" aria-label="Right">→</button>

    <div class="db-empty"></div>
    <button class="db" id="db-down"  aria-label="Down">↓</button>
    <div class="db-empty"></div>
  </div>
</div>

<!-- SENTENCE OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-card">
    <div class="ov-title">🌟 Amazing! 🌟</div>
    <div class="ov-word" id="ov-word"></div>
    <div class="ov-sentence" id="ov-sentence"></div>
    <label class="ov-check-area">
      <input type="checkbox" id="read-cb">
      <span>I read the sentence! (+1 🪙)</span>
    </label>
    <button class="h-btn h-btn-green" id="next-btn">Next Word →</button>
  </div>
</div>

<!-- SECRET MODAL (tap token display 5× fast to reveal) -->
<div class="secret-modal" id="secret-modal">
  <div class="sm-card">
    <div>🔐 Secret Stats 🔐</div>
    <br>
    <div>All-time tokens: <strong id="lifetime-val">0</strong> 🪙</div>
    <br>
    <button class="sm-close" id="sm-close">Close</button>
  </div>
</div>

<!-- CONFETTI -->
<div id="confetti-layer"></div>

<script src="../../shared/game.js"></script>

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const N = 10;
const CELLS = N * N;
const OBS_COUNT = 18;
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const OBS_EMOJI = ['👾','🧱','🌵','🪨','🦕','🤖','👻','🌊','🌴','🐉'];
const PLAYER = '🐸';
const SAD    = '😞';

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let grid = [];
let pRow = 4, pCol = 4;
let wordObj = null;
let letterIdx = 0;
let wordsCompleted = 0;
let phase = 'spelling';   // 'spelling' | 'sentence'
let sadActive = false;
let sadTimer = null;
let usedWords = { 'pre-k': new Set(), 'kinder': new Set(), 'first': new Set() };

// ─────────────────────────────────────────────
// WORD SELECTION
// ─────────────────────────────────────────────
function pickWord() {
  const r = Math.random();
  let level = r < 0.20 ? 'pre-k' : r < 0.90 ? 'kinder' : 'first';
  const pool = WORDS[level];
  if (usedWords[level].size >= pool.length) usedWords[level].clear();
  const avail = pool.map((_,i) => i).filter(i => !usedWords[level].has(i));
  const idx = avail[Math.floor(Math.random() * avail.length)];
  usedWords[level].add(idx);
  return pool[idx];
}

// ─────────────────────────────────────────────
// GRID
// ─────────────────────────────────────────────
function buildGrid() {
  const letters = wordObj.word.toUpperCase().split('');
  grid = Array.from({ length: CELLS }, () => ({ type: 'empty' }));
  const pPos = pRow * N + pCol;

  // Place obstacles
  const reserved = new Set([pPos]);
  let attempts = 0;
  while (reserved.size < OBS_COUNT + 1 && attempts < 9999) {
    const pos = Math.floor(Math.random() * CELLS);
    if (!reserved.has(pos)) {
      reserved.add(pos);
      grid[pos] = { type: 'obstacle', emoji: OBS_EMOJI[Math.floor(Math.random() * OBS_EMOJI.length)] };
    }
    attempts++;
  }

  // Guarantee one cell per letter in the word (handles duplicates)
  for (const ch of letters) {
    let pos, tries = 0;
    do { pos = Math.floor(Math.random() * CELLS); tries++; }
    while ((grid[pos].type !== 'empty' || pos === pPos) && tries < 9999);
    grid[pos] = { type: 'letter', char: ch };
  }

  // Fill remaining empty cells with random letters
  for (let i = 0; i < CELLS; i++) {
    if (grid[i].type === 'empty' && i !== pPos) {
      grid[i] = { type: 'letter', char: ALPHA[Math.floor(Math.random() * 26)] };
    }
  }
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  let html = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const idx  = r * N + c;
      const cell = grid[idx];
      const isPlayer = r === pRow && c === pCol;

      if (isPlayer) {
        const under = cell.type === 'letter' ? cell.char : '';
        html += `<div class="cell cell-player" data-i="${idx}">` +
                `<span class="player-emoji">${sadActive ? SAD : PLAYER}</span>` +
                (under ? `<span class="under-char">${under}</span>` : '') +
                `</div>`;
      } else if (cell.type === 'obstacle') {
        html += `<div class="cell cell-obstacle">${cell.emoji}</div>`;
      } else if (cell.type === 'letter') {
        html += `<div class="cell cell-letter">${cell.char}</div>`;
      } else {
        html += `<div class="cell cell-empty"></div>`;
      }
    }
  }
  document.getElementById('grid').innerHTML = html;
}

function renderWord() {
  const letters = wordObj.word.toUpperCase().split('');
  document.getElementById('word-letters').innerHTML = letters.map((ch, i) => {
    const cls = i < letterIdx ? 'wl collected' : i === letterIdx ? 'wl next' : 'wl';
    return `<div class="${cls}">${ch}</div>`;
  }).join('');
  document.getElementById('penalty-warning').classList.toggle('show', wordsCompleted >= 10);
}

function updateWordsDisplay() {
  document.getElementById('words-count').textContent = wordsCompleted;
}

// ─────────────────────────────────────────────
// MOVEMENT & SELECTION
// ─────────────────────────────────────────────
function move(dr, dc) {
  if (phase !== 'spelling') return;
  const nr = pRow + dr, nc = pCol + dc;
  if (nr < 0 || nr >= N || nc < 0 || nc >= N) return;
  if (grid[nr * N + nc].type === 'obstacle') return;
  pRow = nr; pCol = nc;
  render();
}

function eat() {
  if (phase !== 'spelling' || sadActive) return;
  const idx  = pRow * N + pCol;
  const cell = grid[idx];
  if (cell.type !== 'letter') return;

  const needed = wordObj.word.toUpperCase()[letterIdx];
  if (cell.char === needed) {
    grid[idx] = { type: 'empty' };
    letterIdx++;
    render();
    renderWord();
    if (letterIdx >= wordObj.word.length) wordComplete();
  } else {
    wrongLetter();
  }
}

// ─────────────────────────────────────────────
// WRONG LETTER
// ─────────────────────────────────────────────
function wrongLetter() {
  if (sadActive) return;
  if (wordsCompleted >= 10) Hallie.addSession(-1);

  sadActive = true;
  render();
  document.querySelector('.cell-player')?.classList.add('wiggle');

  clearTimeout(sadTimer);
  sadTimer = setTimeout(() => { sadActive = false; render(); }, 900);
}

// ─────────────────────────────────────────────
// WORD COMPLETE
// ─────────────────────────────────────────────
function wordComplete() {
  phase = 'sentence';
  Hallie.addSession(1);
  wordsCompleted++;
  updateWordsDisplay();
  Hallie.confetti();

  setTimeout(() => {
    document.getElementById('ov-word').textContent = wordObj.word.toUpperCase();
    document.getElementById('ov-sentence').textContent = wordObj.s;
    document.getElementById('read-cb').checked = false;
    document.getElementById('overlay').classList.add('show');
  }, 500);
}

// ─────────────────────────────────────────────
// NEXT WORD
// ─────────────────────────────────────────────
function nextWord() {
  document.getElementById('overlay').classList.remove('show');
  wordObj = pickWord();
  letterIdx = 0;
  phase = 'spelling';
  sadActive = false;
  pRow = 4; pCol = 4;
  buildGrid();
  render();
  renderWord();
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
document.getElementById('read-cb').addEventListener('change', function() {
  Hallie.addSession(this.checked ? 1 : -1);
});

document.getElementById('next-btn').addEventListener('click', nextWord);

document.addEventListener('keydown', e => {
  if (phase === 'sentence') { if (e.key === 'Enter') nextWord(); return; }
  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); move(-1, 0); break;
    case 'ArrowDown':  e.preventDefault(); move( 1, 0); break;
    case 'ArrowLeft':  e.preventDefault(); move( 0,-1); break;
    case 'ArrowRight': e.preventDefault(); move( 0, 1); break;
    case ' ':          e.preventDefault(); eat();       break;
    case 'w': case 'W': move(-1, 0); break;
    case 's': case 'S': move( 1, 0); break;
    case 'a': case 'A': move( 0,-1); break;
    case 'd': case 'D': move( 0, 1); break;
  }
});

// D-pad
(function() {
  const map = {
    'db-up':    () => move(-1, 0),
    'db-down':  () => move( 1, 0),
    'db-left':  () => move( 0,-1),
    'db-right': () => move( 0, 1),
    'db-eat':   () => eat(),
  };
  for (const [id, fn] of Object.entries(map)) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', e => { e.preventDefault(); btn.classList.add('pressed'); fn(); }, { passive: false });
    btn.addEventListener('touchend',   e => { e.preventDefault(); btn.classList.remove('pressed'); }, { passive: false });
    btn.addEventListener('mousedown',  e => { e.preventDefault(); fn(); });
  }
})();

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
