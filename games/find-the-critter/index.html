<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Find the Critter — Hallie's Games</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  /* Full-screen game — body fills viewport, no scroll */
  body {
    overflow: hidden;
    height: 100vh;
    background: #06090e;   /* deep navy-black so warm light reads clearly */
    padding-bottom: 0;
    cursor: none;
  }

  /* Restore pointer on interactive topbar elements */
  .token-display, .back-btn, #level-pill { cursor: pointer; }

  /* ── Flashlight cursor emoji ── */
  #flashlight-cursor {
    position: fixed;
    font-size: 34px;
    line-height: 1;
    pointer-events: none;
    z-index: 20;
    /* Beam-end sits at the hotspot; emoji body hangs upper-right */
    transform: translate(-72%, -88%) rotate(20deg);
    will-change: left, top;
    left: -200px;  /* off-screen until first move */
    top: -200px;
  }

  /* ── Darkness overlay ── */
  #darkness {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: #06090e;   /* solid dark before first move */
  }

  /* ── Critter ── */
  #critter {
    position: fixed;
    font-size: 70px;       /* set by JS per difficulty */
    line-height: 1;
    transform: translate(-50%, -50%);
    z-index: 1;
    cursor: none;
    transition: transform 0.15s;
    will-change: transform;
  }

  #critter.wiggling {
    animation: critter-wiggle 0.4s ease-in-out infinite alternate;
  }

  #critter.caught {
    animation: critter-caught 0.5s ease forwards;
    pointer-events: none;
  }

  @keyframes critter-wiggle {
    from { transform: translate(-50%, -50%) rotate(-12deg) scale(1.05); }
    to   { transform: translate(-50%, -50%) rotate(12deg)  scale(1.1); }
  }

  @keyframes critter-caught {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    40%  { transform: translate(-50%, -80%) scale(1.5) rotate(20deg); opacity: 1; }
    100% { transform: translate(-50%, -120%) scale(0) rotate(45deg); opacity: 0; }
  }


  /* ── "Move your finger to search!" first-load hint ── */
  #search-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    color: rgba(255,255,255,0.45);
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.6s;
    white-space: nowrap;
  }
  #search-hint.hidden { opacity: 0; }

  /* ── Score + level pills ── */
  #found-count { font-variant-numeric: tabular-nums; }
  #level-pill { user-select: none; }

  /* ── Difficulty picker ── */
  .diff-btns {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
  }
  .diff-btn {
    border: none;
    border-radius: 16px;
    padding: 16px 22px;
    font-family: var(--font);
    font-weight: bold;
    cursor: pointer;
    font-size: clamp(1.15rem, 4.5vw, 1.55rem);
    line-height: 1.25;
    transition: transform .1s, box-shadow .1s;
  }
  .diff-btn:hover  { transform: translateY(-2px); }
  .diff-btn:active { transform: translateY(0); }
  .diff-btn .diff-sub {
    display: block;
    font-size: 0.62em;
    font-weight: normal;
    opacity: 0.9;
    margin-top: 3px;
  }
  .diff-easy { background: linear-gradient(135deg, #4cff8c, #00b84a); color: #0d1b2a; box-shadow: 0 4px 20px rgba(76,255,140,0.35); }
  .diff-med  { background: linear-gradient(135deg, #64c8ff, #2a7fd0); color: #0d1b2a; box-shadow: 0 4px 20px rgba(100,200,255,0.35); }
  .diff-hard { background: linear-gradient(135deg, #ff6b6b, #d63333); color: #fff;    box-shadow: 0 4px 20px rgba(255,107,107,0.35); }
</style>
</head>
<body>

<!-- TOPBAR (dark floating variant) -->
<div class="topbar topbar-dark">
  <div class="token-display" id="token-display">
    🪙 <span id="token-count">0</span> tokens
  </div>
  <div class="score-display">
    🐾 Found: <span id="found-count">0</span>
  </div>
  <div class="score-display" id="level-pill">🎚️ <span id="level-label">Easy</span></div>
  <a href="../" class="back-btn">← Games</a>
</div>

<!-- CRITTER -->
<div id="critter">🐰</div>

<!-- FLASHLIGHT CURSOR -->
<div id="flashlight-cursor">🔦</div>

<!-- DARKNESS OVERLAY -->
<div id="darkness"></div>

<!-- FLASH MESSAGE -->
<div class="flash-msg" id="flash-msg"></div>

<!-- DIFFICULTY PICKER -->
<div class="overlay show" id="level-overlay">
  <div class="ov-card">
    <div class="ov-title">🔦 Pick a Level! 🐾</div>
    <div class="diff-btns">
      <button class="diff-btn diff-easy" data-level="easy">
        Easy 🐘
        <span class="diff-sub">Big critters &amp; a big flashlight</span>
      </button>
      <button class="diff-btn diff-med" data-level="medium">
        Medium 🐰
        <span class="diff-sub">Smaller critters &amp; a smaller light</span>
      </button>
      <button class="diff-btn diff-hard" data-level="hard">
        Hard 🐜
        <span class="diff-sub">Tiny critters &amp; a tiny light!</span>
      </button>
    </div>
  </div>
</div>

<!-- SECRET MODAL -->
<div class="secret-modal" id="secret-modal">
  <div class="sm-card">
    <div>🔐 Secret Stats 🔐</div>
    <br>
    <div>All-time tokens: <strong id="lifetime-val">0</strong> 🪙</div>
    <br>
    <button class="sm-close" id="sm-close">Close</button>
  </div>
</div>

<!-- CONFETTI -->
<div id="confetti-layer"></div>

<!-- FIRST-LOAD HINT -->
<div id="search-hint">🔦 Move your mouse (or finger) to search the darkness!</div>

<script src="../../shared/game.js"></script>
<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const TOPBAR_H = 64;   // px — safe zone below topbar

// Each level scales the flashlight beam AND the critter size together.
//   flashR    — radius of the lit circle (px)
//   critterPx — critter emoji font-size (px)
const LEVELS = {
  easy:   { label: 'Easy',   flashR: 165, critterPx: 104 },
  medium: { label: 'Medium', flashR: 118, critterPx: 68  },
  hard:   { label: 'Hard',   flashR: 78,  critterPx: 42  },
};

// Lots of different critters — cute animals, bugs, and sea friends!
const CRITTERS = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
  '🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆',
  '🦉','🦇','🐺','🐗','🐴','🦄','🐝','🦋','🐌','🐞',
  '🐢','🐍','🦎','🐙','🦑','🦐','🦀','🐠','🐟','🐬',
  '🐳','🦈','🐊','🦓','🐘','🦒','🦘','🐿️','🦔','🦝',
  '🦥','🦦','🐕','🐈','🐇','🦜','🦢','🦩','🐣','🐥'
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let flashR    = LEVELS.easy.flashR;  // active beam radius
let nearDist  = 0;                   // critter wiggles inside this
let litDist   = 0;                   // critter catchable inside this
let edgePad   = 80;                  // padding from screen edges (scales w/ critter)

let critterX = 0, critterY = 0;
let cursorX  = -999, cursorY = -999;
let foundCount = 0;
let catching = false;
let playing  = false;   // false while the picker overlay is up
let hintDismissed = false;

const darkness         = document.getElementById('darkness');
const critterEl        = document.getElementById('critter');
const foundCountEl      = document.getElementById('found-count');
const levelLabelEl     = document.getElementById('level-label');
const levelPill        = document.getElementById('level-pill');
const levelOverlay     = document.getElementById('level-overlay');
const hintEl           = document.getElementById('search-hint');
const flashlightCursor = document.getElementById('flashlight-cursor');

// ─────────────────────────────────────────────
// LEVEL SELECTION
// ─────────────────────────────────────────────
function applyLevel(key) {
  const cfg = LEVELS[key];
  flashR   = cfg.flashR;
  nearDist = flashR + 120;   // wiggle range
  litDist  = flashR - 10;    // catch range
  edgePad  = Math.round(cfg.critterPx * 0.7) + 30;

  critterEl.style.fontSize = cfg.critterPx + 'px';
  levelLabelEl.textContent = cfg.label;

  levelOverlay.classList.remove('show');
  playing = true;

  // Repaint the beam at its new size if we already have a cursor position
  if (cursorX > -999) updateLight(cursorX, cursorY);

  spawnCritter();
}

function openLevelPicker() {
  playing = false;
  catching = false;
  critterEl.classList.remove('wiggling');
  levelOverlay.classList.add('show');
}

levelOverlay.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLevel(btn.dataset.level));
});
levelPill.addEventListener('click', openLevelPicker);

// ─────────────────────────────────────────────
// CRITTER PLACEMENT
// ─────────────────────────────────────────────
function spawnCritter() {
  catching = false;
  critterEl.classList.remove('caught', 'wiggling');

  // Pick a different critter than the last one
  const current = critterEl.textContent;
  const pool = CRITTERS.filter(m => m !== current);
  critterEl.textContent = pool[Math.floor(Math.random() * pool.length)];

  // Random safe position
  const minX = edgePad;
  const maxX = window.innerWidth  - edgePad;
  const minY = TOPBAR_H + edgePad;
  const maxY = window.innerHeight - edgePad;

  critterX = minX + Math.random() * (maxX - minX);
  critterY = minY + Math.random() * (maxY - minY);

  critterEl.style.left = critterX + 'px';
  critterEl.style.top  = critterY + 'px';
}

// ─────────────────────────────────────────────
// FLASHLIGHT + PROXIMITY UPDATE
// ─────────────────────────────────────────────
function updateLight(x, y) {
  cursorX = x;
  cursorY = y;

  // Move the flashlight emoji cursor to follow the pointer
  flashlightCursor.style.left = x + 'px';
  flashlightCursor.style.top  = y + 'px';

  // Two-layer gradient:
  // 1. Warm hot-spot — soft yellow glow at the beam center (mimics real light)
  // 2. Darkness — transparent circle carving visibility, fading to near-black
  const r = flashR;
  darkness.style.background =
    `radial-gradient(circle ${Math.round(r * 0.42)}px at ${x}px ${y}px,` +
    ` rgba(255,238,150,0.22) 0%, rgba(255,220,100,0.06) 60%, transparent 100%),` +
    `radial-gradient(circle ${r}px at ${x}px ${y}px,` +
    ` transparent 0%, transparent 52%, rgba(0,0,0,0.55) 72%, rgba(0,0,0,0.97) 100%)`;

  if (!playing || catching) return;

  // Distance from flashlight center to critter center
  const dx = x - critterX;
  const dy = y - critterY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  critterEl.classList.toggle('wiggling', dist < nearDist);
}

// ─────────────────────────────────────────────
// CATCH
// ─────────────────────────────────────────────
function tryClick(x, y) {
  if (!playing || catching) return;

  const dx = x - critterX;
  const dy = y - critterY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > litDist) return; // in the dark — ignore

  catching = true;
  foundCount++;
  foundCountEl.textContent = foundCount;

  critterEl.classList.remove('wiggling');
  critterEl.classList.add('caught');

  Hallie.addSession(1);
  Hallie.confetti();
  Hallie.flashMessage('Found it! 🎉');

  setTimeout(spawnCritter, 1600);
}

// ─────────────────────────────────────────────
// HINT DISMISSAL
// ─────────────────────────────────────────────
function dismissHint() {
  if (hintDismissed) return;
  hintDismissed = true;
  hintEl.classList.add('hidden');
}

// ─────────────────────────────────────────────
// MOUSE EVENTS
// ─────────────────────────────────────────────
document.addEventListener('mousemove', e => {
  dismissHint();
  updateLight(e.clientX, e.clientY);
});

document.addEventListener('click', e => {
  tryClick(e.clientX, e.clientY);
});

// ─────────────────────────────────────────────
// TOUCH EVENTS
// ─────────────────────────────────────────────
document.addEventListener('touchmove', e => {
  e.preventDefault();
  dismissHint();
  const t = e.touches[0];
  updateLight(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchstart', e => {
  dismissHint();
  const t = e.touches[0];
  updateLight(t.clientX, t.clientY);
  tryClick(t.clientX, t.clientY);
}, { passive: true });

// ─────────────────────────────────────────────
// INIT — wait for the player to pick a level
// ─────────────────────────────────────────────
Hallie.initSecretTap(document.getElementById('token-display'));
</script>
</body>
</html>
